name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # No uv.lock in this repo: install like users do, then run pytest from the venv.
      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e . "pytest>=9.0.3"

      - name: Run test suite
        run: .venv/bin/python -m pytest tests/ -v
