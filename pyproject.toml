[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radharmony"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    # Upper bounds: newer versions change the DICOM reading (eval/TODO.md, "New package versions").
    "monai[itk]<1.6",  # 1.6.1 warns on each LoadImageD when nvImageCodec is missing
    "itk<5.4.6",  # 5.4.6 and later (new GDCM) gives wrong pixels for a signed 12-bit MONOCHROME1 DICOM
    "torch",
    "pandas",
    "openpyxl",  # pd.read_excel for CheXpert race labels .xlsx
    "numpy",
    "pydicom",
    "pycocotools",
    "opencv-python-headless",  # cv2.polylines for the RANZCR CLiP catheter masks
    "simpleitk>=2.5.3,<2.5.4",  # 2.5.4 and later (new GDCM) cannot read a signed 12-bit MONOCHROME1 DICOM
    "pyarrow>=15",
    "tqdm",
    "scikit-learn",
    "matplotlib>=3.10.8",
    "ipykernel>=7.2.0",
]

[project.optional-dependencies]
model = [
    "torchvision>=0.26.0",
    "transformers>=5.6.0",
    "nvidia-cudnn-cu12>=9.20.0.48",
    "nvidia-cusparselt-cu12>=0.8.1",
    "nvidia-nccl-cu12>=2.29.7",
    "nvidia-nvshmem-cu12>=3.6.5",
]
notebook = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
]
app = [
    "gradio>=6.10.0",
]
raddino = [
    "rad-dino",
]
biomed = [
    "open-clip-torch",
    "transformers>=5.6.0",
    "torchvision>=0.26.0",
]
chexagent = ["transformers>=5.6.0", "sentencepiece", "protobuf"]
# Generative CheXagent-2-3b. The model card PINS transformers==4.40.0 +
# torch==2.7.1; install WITHOUT the `model`/`radeval` extras (they require
# newer transformers — deliberate conflict, hence the two-env workflow).
# Stage A only: `uv pip install -e ".[chexagent_gen]"` in its own env.
chexagent_gen = [
    "transformers==4.40.0",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "accelerate",
    "einops",
    "opencv-python-headless",  # same cv2 as the core install, no second copy
    "albumentations",
    "sentencepiece",
    "protobuf",
]
# Generative MAIRA-2 (microsoft/maira-2). Needs transformers>=4.46, so
# it conflicts with chexagent_gen's transformers==4.40.0 — separate venv.
# Stage A only: `uv pip install -e ".[maira2_gen]"` in its own env.
maira2_gen = [
    # transformers 5.x refactored LlavaForConditionalGeneration to require
    # self.model; MAIRA-2's custom-code Maira2ForConditionalGeneration doesn't
    # define it → AttributeError at inference. Pin to the 4.46.x line the
    # MAIRA-2 model card was developed against.
    "transformers>=4.46.0,<4.47",
    "huggingface-hub<1.0",
    "accelerate>=0.27.0",
    "torch",
    "torchvision",
    "pillow",
    "sentencepiece",
    "protobuf",
]
# Generative MedGemma-4B (google/medgemma-4b-it) for VQA and report generation.
# It is based on Gemma 3, so it needs a recent transformers. It is GATED on Hugging
# Face: accept the license and run `huggingface-cli login` first. It pins torch 2.7.1,
# so it needs its own env: `uv pip install -e ".[medgemma_gen]"`.
medgemma_gen = [
    "transformers>=5.6.0",
    "accelerate>=0.27.0",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "pillow",
    "sentencepiece",
    "protobuf",
    "huggingface_hub",
]
# jbdel/RadEval (v2.2.1, EMNLP 2025). NOT on PyPI — the PyPI `radeval` 0.0.x
# is an unrelated package. Install the real framework from GitHub source.
# Stage B only: separate env (newer transformers) — never with chexagent_gen.
# RadEval needs Python 3.11 or newer. On Python 3.10 this extra installs nothing.
radeval = [
    "radeval[api] @ git+https://github.com/jbdel/RadEval.git ; python_version >= '3.11'",
]
medsiglip  = ["transformers>=5.6.0", "sentencepiece", "protobuf"]
# The model code imports these at module level (V-A-46, rule L-019).
medimageinsights = ["mup", "fvcore", "tenacity", "huggingface_hub", "torchvision>=0.26.0",
                    "transformers>=5.6.0", "timm", "einops", "safetensors", "yacs", "pyyaml", "pillow"]
chexfound = ["omegaconf", "torchvision>=0.26.0"]
dinov3 = ["transformers>=5.6.0"]
eva_x = ["timm", "huggingface_hub", "torchvision>=0.26.0"]
ark_plus = ["torchvision>=0.26.0"]
medical_mae = ["torchvision>=0.26.0"]
siglip2 = ["transformers>=5.6.0", "sentencepiece", "protobuf"]
all = [
    "radharmony[model,notebook,app]",
]

[tool.uv]
# chexagent_gen (transformers==4.40.0, torch==2.7.1), maira2_gen
# (transformers>=4.46,<4.47) and medgemma_gen (torch==2.7.1, torchvision==0.22.1)
# intentionally pin older versions per their model cards; they cannot resolve alongside any extra pulling transformers>=5.6.0 or
# torch/torchvision>=recent. Declared pairwise so `uv lock` produces separate
# resolutions per install space instead of failing outright.
conflicts = [
    [{ extra = "chexagent_gen" }, { extra = "maira2_gen" }],
    [{ extra = "chexagent_gen" }, { extra = "radeval" }],
    [{ extra = "chexagent_gen" }, { extra = "all" }],
    [{ extra = "chexagent_gen" }, { extra = "model" }],
    [{ extra = "chexagent_gen" }, { extra = "biomed" }],
    [{ extra = "chexagent_gen" }, { extra = "chexagent" }],
    [{ extra = "chexagent_gen" }, { extra = "medsiglip" }],
    [{ extra = "chexagent_gen" }, { extra = "dinov3" }],
    [{ extra = "chexagent_gen" }, { extra = "siglip2" }],
    [{ extra = "chexagent_gen" }, { extra = "eva_x" }],
    [{ extra = "chexagent_gen" }, { extra = "ark_plus" }],
    [{ extra = "chexagent_gen" }, { extra = "medical_mae" }],
    [{ extra = "chexagent_gen" }, { extra = "medimageinsights" }],
    [{ extra = "chexagent_gen" }, { extra = "chexfound" }],
    [{ extra = "maira2_gen" }, { extra = "all" }],
    [{ extra = "maira2_gen" }, { extra = "model" }],
    [{ extra = "maira2_gen" }, { extra = "biomed" }],
    [{ extra = "maira2_gen" }, { extra = "chexagent" }],
    [{ extra = "maira2_gen" }, { extra = "medsiglip" }],
    [{ extra = "maira2_gen" }, { extra = "dinov3" }],
    [{ extra = "maira2_gen" }, { extra = "siglip2" }],
    [{ extra = "maira2_gen" }, { extra = "radeval" }],
    [{ extra = "maira2_gen" }, { extra = "medimageinsights" }],
    [{ extra = "chexagent_gen" }, { extra = "medgemma_gen" }],
    [{ extra = "maira2_gen" }, { extra = "medgemma_gen" }],
    [{ extra = "medgemma_gen" }, { extra = "all" }],
    [{ extra = "medgemma_gen" }, { extra = "model" }],
    [{ extra = "medgemma_gen" }, { extra = "biomed" }],
    [{ extra = "medgemma_gen" }, { extra = "chexagent" }],
    [{ extra = "medgemma_gen" }, { extra = "medsiglip" }],
    [{ extra = "medgemma_gen" }, { extra = "dinov3" }],
    [{ extra = "medgemma_gen" }, { extra = "siglip2" }],
    [{ extra = "medgemma_gen" }, { extra = "eva_x" }],
    [{ extra = "medgemma_gen" }, { extra = "ark_plus" }],
    [{ extra = "medgemma_gen" }, { extra = "medical_mae" }],
    [{ extra = "medgemma_gen" }, { extra = "medimageinsights" }],
    [{ extra = "medgemma_gen" }, { extra = "chexfound" }],
]

# Keep the lock universal (it resolves for every platform), but make uv try fewer
# version forks. The default "requires-python" strategy makes one resolution for
# each Python version. With the many conflicting extras that pull an unpinned torch
# and its large NVIDIA `cuda-toolkit` tree, `uv lock` then backtracks for about 90 min.
# "fewest" prefers the smallest set of versions.
fork-strategy = "fewest"

[tool.setuptools.packages.find]
where = ["."]
include = ["radharmony*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff==0.17.3",
    "vulture>=2.16",
]

[tool.ruff]
line-length = 120
extend-exclude = ["radharmony/evaluator/backbones/_template.py", "scripts/legacy", "notebooks"]

[tool.ruff.lint]
# Rules that find bugs. Style is not checked here.
select = ["E9", "F", "B", "PLE", "PLW0177", "PLR0124", "S110", "S112"]

[tool.ruff.lint.per-file-ignores]
# L-020: no silent `except: pass` or `except: continue` around a file read in a harmonizer.
"!radharmony/harmonizer/**" = ["S110", "S112"]
