site_name: RadHarmony
site_description: Unified API for public radiological datasets (CXR, CT, MRI)
site_url: https://f10409.github.io/RadHarmony
use_directory_urls: false
repo_url: https://github.com/f10409/RadHarmony
repo_name: f10409/RadHarmony

docs_dir: docs/wiki

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started:
    - Quickstart: quickstart.md
    - Architecture: architecture.md
  - Datasets:
    - Overview: datasets.md
    - Acquiring Datasets: acquiring-datasets.md
    - Phase Grounding (Label Extraction): phase-grounding.md
    - CheXpert: datasets/chexpert.md
    - CheXpert-Plus: datasets/chexpert_plus.md
    - CheXlocalize: datasets/chexlocalize.md
    - MIMIC-CXR (DICOM): datasets/mimic_cxr.md
    - MIMIC-CXR-JPG: datasets/mimic_cxr_jpg.md
    - ChestX-ray14: datasets/chestxray14.md
    - PadChest: datasets/padchest.md
    - ReXGradient-160K: datasets/rexgradient.md
    - VinDr-CXR: datasets/vindr_cxr.md
    - Chest ImaGenome: datasets/chest_imagenome.md
    - VinDr-PCXR: datasets/vindr_pcxr.md
    - BRAX: datasets/brax.md
    - RANZCR CLiP: datasets/ranzcr_clip.md
    - SIIM-ACR Pneumothorax: datasets/siim_acr_ptx.md
    - SIIM COVID-19: datasets/siim_covid19.md
    - RSNA Pneumonia (Adjudicated JSON): datasets/rsna_pneumonia.md
    - RSNA Pneumonia (Kaggle): datasets/rsna_pneumonia_kaggle.md
    - RSNA PE Detection <sup class="beta">beta</sup>: datasets/rsna_pe_detection.md
    - RSNA Pediatric Bone Age <sup class="beta">beta</sup>: datasets/rsna_bone_age.md
    - RSNA 2024 Lumbar Spine <sup class="beta">beta</sup>: datasets/rsna_2024_lumbar_spine.md
    - CT-RATE <sup class="beta">beta</sup>: datasets/ct_rate.md
    - RAD-ChestCT <sup class="beta">beta</sup>: datasets/radchestct.md
