# Words that the STE linter flags (rule STE-06), with the word to use.
# Keys are lower case. A key with a space is a phrase.
[avoid]
"utilize" = "use"
"utilise" = "use"
"utilizes" = "uses"
"utilization" = "use"
"in order to" = "to"
"prior to" = "before"
"subsequent to" = "after"
"subsequently" = "then"
"leverage" = "use"
"leverages" = "uses"
"leveraging" = "using"
"facilitate" = "help, let"
"facilitates" = "helps, lets"
"commence" = "start"
"terminate" = "stop, end"
"approximately" = "about"
"numerous" = "many"
"furthermore" = "also"
"additionally" = "also"
"moreover" = "also"
"thus" = "so"
"hence" = "so"
"whereas" = "but"
"whilst" = "while"
"aforementioned" = "this, that"
"in the event that" = "if"
"due to the fact that" = "because"
"a number of" = "some, many"
"is able to" = "can"
"are able to" = "can"
"e.g." = "for example"
"i.e." = "that is"
"etc." = "(give the full list)"
"delve" = "look at"
"robust" = "(say what it resists)"
"seamless" = "(say what works)"
"seamlessly" = "(say what works)"
"comprehensive" = "full, complete"
"crucial" = "important"
"pivotal" = "important"
"showcase" = "show"
"underscore" = "show"
"intricate" = "complex"
"notably" = "(remove)"
"essentially" = "(remove)"
"basically" = "(remove)"
"simply" = "(remove)"
"straightforward" = "simple"

