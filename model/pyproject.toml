[project]
name = "lejepa-2d"
version = "0.1.0"
description = "2D LeJEPA self-supervised pretraining with RadHarmony datasets"
requires-python = ">=3.12"
dependencies = [
    "radharmony",
    "torch>=2.9.1",
    "lightning>=2.6.0",
    "transformers>=4.57.3",
    "wandb>=0.23.1",
    "einops>=0.8.1",
    "torchmetrics>=1.0.0",
    "lejepa @ git+https://github.com/galilai-group/lejepa",
    "monai[itk]>=1.5.1",
    "scipy>=1.17.1",
    "scikit-learn>=1.8.0",
    "timm>=1.0.26",
    "scikit-multilearn>=0.2.0",
]

[tool.uv.sources]
radharmony = { path = "..", editable = true }
