[project]
name = "lejepa-2d"
version = "0.1.0"
description = "2D LeJEPA self-supervised pretraining with RadHarmony datasets"
requires-python = ">=3.12"
dependencies = [
    "radharmony",
    "torch>=2.9.1",
    "lightning>=2.6.0",
    "transformers>=4.57.3",
    "wandb>=0.23.1",
    "einops>=0.8.1",
    "torchmetrics>=1.0.0",
    "lejepa @ git+https://github.com/galilai-group/lejepa",
    "monai[itk]>=1.5.1",
    "scipy>=1.17.1",
    "scikit-learn>=1.8.0",
    "timm>=1.0.26",
    "scikit-multilearn>=0.2.0",
    "open-clip-torch>=3.3.0",
    "sentencepiece>=0.2.1",
    "gradio>=6.14.0",
    "bkh-pytorch-utils>=0.11.0",
    # flash-attn>=2.8.3 requires manual install (no PEP-517 metadata):
    #   pip install flash-attn --no-build-isolation
]

[tool.uv.sources]
radharmony = { path = "..", editable = true }
